name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Check that the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the package contents
        run: |
          pnpm pack --dry-run
          tar -tzf "$(pnpm pack --pack-destination . | tail -1)" | head -50

      # Authenticates with npm trusted publishing (OIDC), which needs npm 11.5.1 or later;
      # no npm token is stored in the repo.
      - name: Publish
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
