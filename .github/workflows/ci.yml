name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  smoke:
    name: end to end smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start the mock endpoint
        run: |
          node dist/cli/index.js serve-mock --port 8787 &
          curl --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/health

      - name: Run the example suites
        run: |
          node dist/cli/index.js run examples/suites/support-bot.yaml --out runs
          node dist/cli/index.js run examples/suites/json-output.yaml --out runs
          node dist/cli/index.js run examples/suites/bangla-qa.yaml --out runs
          node dist/cli/index.js run examples/suites/streaming.yaml --out runs

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalcheck-runs
          path: runs
