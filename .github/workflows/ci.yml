name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == '22.x') }}
        run: pnpm test

      - name: Tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.x' }}
        run: |
          pnpm test:coverage
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log(['| Metric | Coverage |','| --- | ---: |',...['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+'% |')].join(String.fromCharCode(10)))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Build
        run: pnpm build

  smoke:
    name: end to end smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start the mock endpoint
        run: |
          node dist/cli/index.js serve-mock --port 8787 &
          curl --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/health

      - name: Run the example suites
        run: |
          for suite in examples/suites/*.yaml; do
            node dist/cli/index.js run "$suite" --out runs --format markdown >> "$GITHUB_STEP_SUMMARY"
          done
          node dist/cli/index.js run examples/project --out runs/project --format markdown >> "$GITHUB_STEP_SUMMARY"
          node dist/cli/index.js run examples/suites/conversation.yaml --out runs --record runs/conversation.recording.json

      - name: Replay a recording with the endpoint stopped
        run: |
          pkill -f serve-mock
          node dist/cli/index.js run examples/suites/conversation.yaml --out runs --replay runs/conversation.recording.json

      - name: Upload the run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalcheck-runs
          path: runs
